name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-release-access:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release token can actually create releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "smoke-test-${{ github.run_id }}" \
            --draft --title "smoke test" --notes "temporary — safe to ignore" \
            --target "${{ github.sha }}"
          gh release delete "smoke-test-${{ github.run_id }}" --yes

  release:
    needs: verify-release-access
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: pnpm install

      - name: Verify migration files haven't drifted since they last shipped
        run: pnpm verify-migrations

      - name: Force a clean rebuild of the app crate
        # The Swatinem/rust-cache above restores target/ from a previous
        # run. include_str! embeds each migration's file content into the
        # compiled binary at build time — if the incremental build cache
        # ever reuses a stale compiled object for this crate, the binary
        # can ship with OLD migration bytes even though the checked-out
        # source is current, and sqlx then rejects every already-installed
        # copy of the app with "migration was previously applied but has
        # been modified" (this broke a real release). Cleaning just this
        # package (not its dependencies) forces lib.rs to always recompile
        # fresh from the just-checked-out source, while keeping the cache's
        # benefit for every third-party dependency crate.
        working-directory: ./src-tauri
        run: cargo clean -p tauri-app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Syntrok InfraNet ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
